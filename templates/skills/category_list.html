{% extends 'base.html' %}

{% block title %}Categories · SkillSwap{% endblock %}

{% block content %}

    <h1 class="text-2xl font-bold">Categories</h1>
    <p class="text-gray-500">Choose a category to see its skill offers.</p>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    {% for category in categories %}
      {% include 'includes/category_tile.html' %}
    {% endfor %}
  </div>
{% endblock %}
