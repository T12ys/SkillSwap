{% extends 'base.html' %}

{% block title %}Edit profile · SkillSwap{% endblock %}

{% block content %}
  <div class="max-w-xl mx-auto card">
    <h1 class="text-2xl font-bold mb-6">Edit profile</h1>

    <div class="flex items-center gap-4 mb-6">
      {% include 'includes/avatar.html' with u=user size='w-16 h-16 text-2xl' %}
      <span class="text-sm text-gray-500">Current avatar</span>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-4" novalidate>
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="flex gap-3">
        <button type="submit" class="btn-primary">Save</button>
        <a href="{% url 'accounts:profile' user.username %}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
