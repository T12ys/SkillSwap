{% extends 'base.html' %}

{% block title %}Sign up · SkillSwap{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto card">
    <h1 class="text-2xl font-bold mb-6">Create an account</h1>
    <form method="post" class="space-y-4" novalidate>
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <button type="submit" class="btn-primary w-full">Sign up</button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account? <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Log in</a>
    </p>
  </div>
{% endblock %}
