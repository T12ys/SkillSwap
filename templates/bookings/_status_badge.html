<span class="rounded px-2 py-0.5 text-xs
  {% if r.status == 'pending' %}bg-yellow-100 text-yellow-800
  {% elif r.status == 'accepted' %}bg-blue-100 text-blue-800
  {% elif r.status == 'completed' %}bg-green-100 text-green-800
  {% elif r.status == 'rejected' %}bg-red-100 text-red-800
  {% else %}bg-gray-200 text-gray-700{% endif %}">{{ r.get_status_display }}</span>
