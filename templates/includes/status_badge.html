<span class="rounded px-2 py-0.5 text-xs
  {% if offer.status == 'published' %}bg-green-100 text-green-800
  {% elif offer.status == 'pending' %}bg-yellow-100 text-yellow-800
  {% elif offer.status == 'rejected' %}bg-red-100 text-red-800
  {% else %}bg-gray-200 text-gray-700{% endif %}">{{ offer.get_status_display }}</span>
