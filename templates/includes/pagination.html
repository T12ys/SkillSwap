{% if page_obj.has_other_pages %}
  <nav class="mt-8 flex items-center justify-center gap-2 text-sm">
    {% if page_obj.has_previous %}
      <a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}"
         class="btn-secondary">&larr; Prev</a>
    {% endif %}
    <span class="px-3 text-gray-600">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}"
         class="btn-secondary">Next &rarr;</a>
    {% endif %}
  </nav>
{% endif %}
