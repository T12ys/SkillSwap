<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillSwap{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style type="text/tailwindcss">
    @layer base {
      input[type=text], input[type=email], input[type=password], input[type=number],
      input[type=search], select, textarea {
        @apply w-full rounded border border-gray-300 bg-white px-3 py-2 text-sm;
      }
      input[type=file] { @apply block w-full text-sm; }
      input[type=checkbox], input[type=radio] { @apply h-4 w-4; }
    }
    @layer components {
      .btn-primary { @apply inline-block rounded bg-blue-600 px-4 py-2 text-center text-sm text-white hover:bg-blue-700; }
      .btn-secondary { @apply inline-block rounded border border-gray-300 bg-white px-4 py-2 text-center text-sm hover:bg-gray-100; }
      .btn-danger { @apply inline-block rounded bg-red-600 px-4 py-2 text-center text-sm text-white hover:bg-red-700; }
      .card { @apply rounded border border-gray-200 bg-white p-5; }
      .nav-link { @apply text-sm text-gray-700 hover:text-blue-600; }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 flex flex-col">
  {% include 'includes/navbar.html' %}

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    {% for message in messages %}
      <div class="mb-4 rounded px-4 py-3 text-sm
        {% if message.tags == 'error' %}bg-red-100 text-red-800
        {% elif message.tags == 'success' %}bg-green-100 text-green-800
        {% else %}bg-blue-100 text-blue-800{% endif %}">
        {{ message }}
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-200 bg-white py-6 text-center text-sm text-gray-500">
    &copy; {% now "Y" %} SkillSwap
  </footer>
</body>
</html>
